version: '3.8'

services:
  student-management:
    image: ghcr.io/chung2310/student-management:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-student-management}
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - .env:/app/.env
    networks:
      - default_network

networks:
  default_network:
    external: true
