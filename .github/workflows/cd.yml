name: CD (Continuous Deployment)

# Chỉ deploy SAU KHI workflow CI (lint, typecheck, build) đã chạy xong và PASS
# trên đúng nhánh develop/production — trước đây CD trigger độc lập bằng `on: push`,
# nghĩa là code lỗi lint/type vẫn có thể bị build Docker & deploy lên VPS nếu
# Docker build không phát hiện ra lỗi đó.
on:
  workflow_run:
    workflows: [ "CI (Integration Test)" ]
    types: [ completed ]
    branches: [ develop, production ]

# Đảm bảo các lần deploy vào cùng 1 môi trường (staging/production) chạy tuần tự,
# không chạy chồng nhau (tránh 2 lần deploy race nhau khi có nhiều push liên tiếp).
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:

  # Bước 1: build & push image Docker. Các job deploy phía dưới đều `needs`
  # job này — job deploy CHỈ chạy khi build-and-push đã hoàn thành và pass.
  build-and-push:
    name: 1) Build & Push Docker Image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Bước 2 (chỉ nhánh develop): deploy lên VPS staging. Chờ build-and-push xong mới chạy.
  deploy-staging:
    name: 2) Deploy Staging VPS
    needs: build-and-push
    if: github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Copy docker-compose.yml to Staging VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "docker-compose.yml"
          target: "/opt/student-management/staging"

      - name: Deploy via SSH to Staging VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: ENV_FILE_CONTENT
          script: |
            set -e
            TARGET_DIR="/opt/student-management/staging"
            IMAGE_TAG="develop"
            CONTAINER_NAME="student-management-staging"

            # Tạo thư mục đích nếu chưa tồn tại và chuyển vào
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Tạo/ghi nội dung cấu hình từ GitHub Secrets vào file .env cục bộ
            echo "$ENV_FILE_CONTENT" > .env

            # Đăng nhập vào GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Giải phóng container cũ có cùng tên
            docker rm -f "$CONTAINER_NAME" || true

            # Kéo (pull) image mới và khởi động lại container tương ứng với env variables
            export COMPOSE_PROJECT_NAME="$CONTAINER_NAME"
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose pull
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose up -d --remove-orphans

            # Giải phóng dung lượng ổ đĩa bằng cách xóa các image dangling/rác cũ
            docker image prune -f

  # Bước 2 (chỉ nhánh production): deploy lên VPS production. Chờ build-and-push xong mới chạy.
  deploy-production:
    name: 2) Deploy Production VPS
    needs: build-and-push
    if: github.event.workflow_run.head_branch == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Copy docker-compose.yml to Production VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD || '22' }}
          source: "docker-compose.yml"
          target: "/opt/student-management/production"

      - name: Deploy via SSH to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_PROD }}
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD || '22' }}
          envs: ENV_FILE_CONTENT
          script: |
            set -e
            TARGET_DIR="/opt/student-management/production"
            IMAGE_TAG="production"
            CONTAINER_NAME="student-management-production"

            # Tạo thư mục đích nếu chưa tồn tại và chuyển vào
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Tạo/ghi nội dung cấu hình từ GitHub Secrets vào file .env cục bộ
            echo "$ENV_FILE_CONTENT" > .env

            # Đăng nhập vào GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Giải phóng container cũ có cùng tên
            docker rm -f "$CONTAINER_NAME" || true

            # Kéo (pull) image mới và khởi động lại container tương ứng với env variables
            export COMPOSE_PROJECT_NAME="$CONTAINER_NAME"
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose pull
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose up -d --remove-orphans

            # Giải phóng dung lượng ổ đĩa bằng cách xóa các image dangling/rác cũ
            docker image prune -f
