name: CI (Integration Test)

on:
  push:
    branches: [ develop, production ]
  pull_request:
    branches: [ develop, production ]

# Hủy các lần chạy CI cũ hơn của cùng 1 PR/nhánh khi có push mới, tránh chạy
# chồng nhiều workflow không cần thiết (tốn phút CI).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Mỗi bước là 1 job riêng, gate bằng `needs` để job sau CHỈ chạy khi job
  # trước đã hoàn thành và pass. node_modules được cache theo hash yarn.lock
  # (actions/setup-node cache: 'yarn' + cache node_modules riêng) nên các job
  # sau tái sử dụng cache thay vì cài lại từ đầu — vẫn nhanh dù tách job.
  lint:
    name: 1) Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run ESLint
        run: yarn lint

  typecheck:
    name: 2) Typecheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Type check
        run: yarn typecheck

  build:
    name: 3) Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build Web & Server
        run: yarn build
